# Gradle JVM 参数：与全局 ~/.gradle/gradle.properties 逐字符一致，确保复用 daemon。
# ⚠️ 重要：项目级与全局 jvmargs 一旦不一致，Gradle 每次都会 fork 一个
# single-use daemon、不复用，构建极慢。且本机内存仅 7.4G、可用常年紧张，
# 3072m 的堆 + Kotlin daemon 同时起会疯狂交换。故这里与全局完全一致
# （-Xmx1280m，metaspace 用全局默认）。
org.gradle.jvmargs=-Xmx1280m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 构建机内存紧张：限制 Kotlin 守护进程内存，并禁用守护进程避免连接失败
kotlin.daemon.jvmargs=-Xmx640m
kotlin.compiler.execution.strategy=in-process
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false

# 注意：此处不再硬编码 android.aapt2FromMavenOverride。
# 原值指向构建机上某个具体路径（/workspace/android-sdk/... 或 /opt/android-sdk/...），
# 换一台机器就会构建失败。AGP 默认会从 Maven 依赖里取 aapt2，正常环境无需任何配置。
# 仅在 aapt2 无法运行的少数环境（如 ARM64 主机）才需要手工指定，可用命令行覆盖：
#   ./gradlew assembleRelease -Pandroid.aapt2FromMavenOverride=/path/to/aapt2
