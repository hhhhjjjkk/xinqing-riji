org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false

# 注意：此处不再硬编码 android.aapt2FromMavenOverride。
# 原值指向构建机上某个具体路径（/workspace/android-sdk/... 或 /opt/android-sdk/...），
# 换一台机器就会构建失败。AGP 默认会从 Maven 依赖里取 aapt2，正常环境无需任何配置。
# 仅在 aapt2 无法运行的少数环境（如 ARM64 主机）才需要手工指定，可用命令行覆盖：
#   ./gradlew assembleRelease -Pandroid.aapt2FromMavenOverride=/path/to/aapt2
